version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketai
      POSTGRES_PASSWORD: marketai
      POSTGRES_DB: marketai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://marketai:marketai@db:5432/marketai
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
