name: Project checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install fastapi==0.115.0 sqlalchemy==2.0.35 psycopg2-binary==2.9.9 pydantic==2.9.2 pydantic-settings==2.5.2 python-jose[cryptography]==3.3.0 passlib==1.7.4 bcrypt==4.0.1 python-dotenv==1.0.1 httpx==0.27.2 pytest==8.3.2 pytest-asyncio==0.24.0 email-validator
      - run: pytest -q app/tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
